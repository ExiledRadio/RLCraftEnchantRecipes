buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }       
		maven {
            name = "github"
            url = "https://github.com/juanmuscaria/maven/raw/master"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle2:[2.3-1.0.0-SNAPSHOT,)'
    }
}

repositories {
	flatDir {
		dirs 'deps'
	}
}

apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'net.minecraftforge.gradle.forge'

version = mod_version
group = mod_group
archivesBaseName = mod_archives_name

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
	// Single-sourced from gradle.properties — see the ceiling note on forge_version there.
	version = "${mc_version}-${forge_version}"
    mappings = "stable_39"
	runDir = "eclipse"

	replace '@VERSION@', project.version
	replaceIn 'RLCraftEnchantRecipes.java'
	// makeObfSourceJar = false
}

processResources {

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version,
		'mod_id': mod_id,
		'mod_name': mod_name,
		'mod_author': mod_author,
		'mod_description': mod_description,
		'mod_credits': mod_credits,
		'mod_url': mod_url,
		'mc_version': mc_version,
		'mod_version': mod_version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

dependencies {
	compileOnly name: 'Baubles-1.12-1.5.2-dev'
	compileOnly name: 'jei_1.12.2-4.16.1.1012'
}

task devJar(type: Jar) {
	classifier = 'dev'
	from sourceSets.main.output
}

task sourcesJar(type: Jar) {
	classifier = 'sources'
	from sourceSets.main.allSource
}

artifacts {
	archives devJar
	archives sourcesJar
}

// Dev convenience: copies the built jar straight into a local test instance so
// testing changes doesn't require a manual copy step. Opt-in and machine-local
// — set `deployDir` in your user gradle.properties (~/.gradle/gradle.properties),
// not here, so the build still works for anyone else who clones the repo.
def deployDir = project.findProperty('deployDir')

task deployToInstance(type: Copy) {
	onlyIf { deployDir && file(deployDir).isDirectory() }
	from jar.archivePath
	into deployDir ?: "$buildDir/deploy"
	rename { "RLCraftEnchantRecipes-${project.version}.jar" }
}

deployToInstance.dependsOn reobfJar
build.finalizedBy deployToInstance